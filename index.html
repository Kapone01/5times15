<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f1e8"><link rel="manifest" href="manifest.json"><title>5×15</title>
<style>
:root{--bg:#f4f1e8;--ink:#202020;--card:#fffdf7;--line:#c9c3b6;--shadow:0 2px 7px #0002}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;justify-content:center}.app{width:100%;height:100%;max-width:1100px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h1{font-size:28px;margin:0;font-weight:750}.sub{font-size:13px;opacity:.65;margin-top:2px}
.buttons{display:flex;gap:8px}button{border:1px solid var(--line);background:#fffaf0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:650;box-shadow:var(--shadow)}
button:active{transform:scale(.97)}.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(92vw,800px);height:min(74vh,780px)}
.card{position:relative;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vw,38px);font-weight:750;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden;padding-left:32px;touch-action:manipulation}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:32px;background:var(--c)}
.card.empty{background:transparent;border:2px dashed #aaa397;box-shadow:none;padding:0}.card.empty::before{display:none}
.card.movable{outline:4px solid #315b45;outline-offset:2px}.status{text-align:center;min-height:52px;font-size:15px;padding:6px}.status strong{display:block;font-size:17px}.rules{font-size:12px;opacity:.6;text-align:center;margin-top:2px}
@media (orientation:portrait){.board{height:min(70vh,680px);width:min(78vw,500px)}.card{font-size:24px;padding-left:26px}.card::before{width:26px}}
</style></head><body><div class="app">
<header><div><h1>5×15</h1><div class="sub">iPad offline prototype</div></div><div class="buttons"><button id="undo" type="button">↶ Undo</button><button id="new" type="button">New game</button></div></header>
<div class="board-wrap"><div id="board" class="board"></div></div><div id="status" class="status"></div>
<div class="rules">Tap a card to select it. Tap an empty space to move it.</div></div>
<script>
const KEY="5x15-v2",colors=["#e8c547","#e58b3a","#5c9b55","#5b83c4","#a56a9e"];let state={cards:[],history:[]},selected=null;
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){let a=[];for(let c=0;c<5;c++)for(let n=1;n<=15;n++)a.push({c,n});shuffled(a);a.splice(0,0,null,null,null,null,null);state={cards:a,history:[]};selected=null;save();render()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.cards&&x.cards.length===80){state=x;return true}}catch(e){}return false}
function render(){let b=document.getElementById("board");b.innerHTML="";state.cards.forEach((x,i)=>{let d=document.createElement("div");d.className="card"+(!x?" empty":"");d.dataset.i=i;if(x){d.style.setProperty("--c",colors[x.c]);d.textContent=x.n;d.addEventListener("click",()=>select(i),{passive:true})}else d.addEventListener("click",()=>emptyTap(i),{passive:true});b.appendChild(d)});document.getElementById("status").innerHTML="<strong>"+(selected!==null?"Now tap an empty space":"Tap a card to select it")+"</strong>"+(state.history.length?"Undo is available":"");if(selected!==null){let e=document.querySelector('.card[data-i="'+selected+'"]');if(e)e.classList.add("movable")}}
function select(i){if(state.cards[i]){selected=i;render()}}
function emptyTap(i){if(selected===null)return;state.history.push(state.cards.map(x=>x?{...x}:null));[state.cards[selected],state.cards[i]]=[state.cards[i],state.cards[selected]];selected=null;save();render()}
document.getElementById("new").onclick=()=>{if(confirm("Start a new game?"))newGame()};document.getElementById("undo").onclick=()=>{if(state.history.length){state.cards=state.history.pop();selected=null;save();render()}};
if(!load())newGame();else render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
